name: Claude review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Review the pull request
        env:
          ANTHROPIC_API_KEY: sk-ant-api03-EXAMPLEKEY123456
        run: |
          claude "Review the change on standard input." --allowedTools "Bash,Edit" > review.txt
